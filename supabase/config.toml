project_id = "le-nanometre"

[api]
enabled = true
schemas = ["public"]

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://127.0.0.1:43123"
additional_redirect_urls = [
  "http://127.0.0.1:43123/auth/callback",
  "http://localhost:43123/auth/callback",
  "lenanometre://auth/callback",
]

[functions.create-payment-intent]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = true

[functions.invite-team-member]
verify_jwt = true
